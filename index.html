<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أفضل مكتب محاماة في جدة | مكتب عبدالعزيز العديني</title>
    <style>
        :root {
            --primary: #0d2c1d;
            --gold: #c29b63;
            --white: #ffffff;
            --whatsapp: #25d366;
            --transition: all 0.3s ease;
        }

        /* تنسيق أيقونة السماعة الاحترافية */
        .icon-phone { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }

        /* الأزرار العامة */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; border-radius: 50px; padding: 10px 20px;
            font-weight: 800; text-decoration: none; transition: var(--transition);
        }

        /* تنسيق الهيدر */
        header { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 2px solid var(--gold); }
        .header-call-btn { background: var(--primary); color: var(--white); font-size: 13px; }

        /* تنسيق الواجهة */
        .hero { padding: 80px 5%; background: var(--primary); color: var(--white); text-align: center; }
        .btn-gold { background: var(--gold); color: var(--primary); }

        /* الشريط العائم */
        .floating-bar {
            position: fixed; bottom: 20px; left: 5%; right: 5%; max-width: 500px; margin: 0 auto;
            background: rgba(13, 44, 29, 0.95); padding: 12px 25px; border-radius: 100px;
            display: flex; justify-content: space-around; border: 1px solid var(--gold);
        }
        .float-link { color: var(--white); text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 6px; }

        /* النافذة المنبثقة */
        .modal { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: #fff; margin: 15% auto; padding: 30px; width: 90%; max-width: 400px; border-radius: 20px; text-align: center; }
        .modal-btn-call { background: var(--gold); color: var(--primary); width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">عبدالعزيز عبدالله العديني</div>
        <a href="tel:+966553878758" class="btn header-call-btn">

            اتصل الآن
        </a>
    </header>

    <section class="hero">
        <h1>حلول قانونية للشركات والتجارة</h1>
        <a href="tel:+966553878758" class="btn btn-gold">
            <svg class="icon-phone" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.19-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>

</body>
</html>
