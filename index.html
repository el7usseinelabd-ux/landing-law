<div class="modal" id="consultationModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-inner">

      <div class="modal-badge">
        <i></i>
        ابدأ التواصل بخطوة واضحة
      </div>

      <div class="modal-logo">
        <img src="logo-main.png" alt="شعار مكتب عبدالعزيز العديني">
      </div>

      <h3 id="modalTitle">لديك قضية أو استفسار قانوني؟</h3>

      <p>
        تحدث مع مكتب عبدالعزيز العديني مباشرة لمشاركة ملخص قضيتك
        وتحديد الخطوة القانونية المناسبة.
      </p>

      <div class="modal-phone" aria-label="رقم المكتب">
        هاتف المكتب
        <span class="phone-number" dir="ltr">055 387 8758</span>
      </div>

      <div class="modal-actions">

        <a
          class="modal-action modal-call"
          href="tel:+966553878758"
          onclick="trackConversion('call','entry_popup')">
          اتصل الآن بالمكتب
        </a>

        <a
          class="modal-action modal-wa"
          href="https://wa.me/966553878758"
          target="_blank"
          rel="noopener"
          onclick="trackConversion('whatsapp','entry_popup')">
          أرسل تفاصيل قضيتك عبر واتساب
        </a>

        <button
          class="modal-action modal-close"
          type="button"
          onclick="closeModal()">
          متابعة تصفح الموقع
        </button>

      </div>

      <p class="modal-note">
        يمكنك إغلاق النافذة ومتابعة تصفح الموقع في أي وقت.
      </p>

    </div>
  </div>
</div>
